name: edupay
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.0.1

  # Transport HTTP vers le backend EduPay (Node/Express)
  http: ^1.2.2

  # Stockage sécurisé du refresh token.
  # IMPORTANT : rester en 8.1.0 (pin exact, PAS de ^).
  # Les versions 9.x/10.x tirent `flutter_secure_storage_darwin` → `objective_c`,
  # dont le hook de build natif (native assets) s'exécute même pour un build
  # Android et échoue sur le chemin Windows contenant un espace
  # (« C:\Users\Cedric Yam\... » → 'C:\Users\Cedric' n'est pas reconnu).
  flutter_secure_storage: ^11.2.0

  # Formatage de dates et monnaies
  intl: ^0.20.2

  # Icônes Cupertino
  cupertino_icons: ^1.0.8

  # Carte OpenStreetMap
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Sélection d'image pour les problèmes de livraison
  image_picker: ^1.1.2

  # Ouverture du clavier téléphonique (url_launcher) utilisée par certaines
  # interactions externes (ex. liens). Aucun mécanisme USSD n'est utilisé.
  url_launcher: ^6.3.1

  # Signature manuscrite (confirmation de réception) : canvas de dessin +
  # export PNG encodé en base64 envoyé au backend.
  signature: ^6.4.0

  # Notifications push (FCM) — token enregistré via POST /notifications/device-token.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3

  # Génération QR — même librairie que l'app agent (qui la scanne), pour
  # garantir un code réellement décodable par un scanner standard.
  qr_flutter: ^4.1.0

  # Génération PDF du contrat + partage/impression natifs (même paire que
  # l'app admin, voir admin/lib/core/export/pdf_exporter.dart).
  pdf: ^3.12.0
  printing: ^5.14.3
  google_fonts: ^8.2.1


# Épinglage transitif : `flutter_map` tire `path_provider`, dont les
# implémentations récentes (path_provider_android 2.3.x → jni,
# path_provider_foundation 2.6.0 → objective_c) sont passées aux « native
# assets ». Le hook de build de ces paquets se lance à CHAQUE build (même
# Android) et plante sur un chemin Windows contenant un espace
# (« C:\Users\Cedric Yam\... » → 'C:\Users\Cedric' n'est pas reconnu).
# On reste sur les dernières versions à canaux de plateforme classiques,
# sans hook natif.
dependency_overrides:
  path_provider_android: 2.2.23
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.31.1


# Configuration de génération du logo de l'application
flutter_launcher_icons:
  android: true
  ios: true

  # Chemin vers ton logo
  image_path: "assets/icon/logo.png"


flutter:

  # Permet l'utilisation des icônes Material
  uses-material-design: true


  # Images et ressources de l'application
  assets:
    - assets/icon/logo.png
    # Catalogue officiel des classes / fournitures / prix (source unique :
    # généré depuis le fichier Excel EduPay_Catalogue_Fournitures_3Kits, voir
    # tools/generate_catalogue.py). Ne pas modifier ce fichier à la main.
    - assets/data/school_catalogue.json