org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Daemon Kotlin séparé du daemon Gradle — sans ceci, il retombe sur un
# défaut disproportionné à la RAM réelle de la machine (7 Go, vécu : plantage
# OOM natif à la compilation malgré `org.gradle.jvmargs` réduit ci-dessus).
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
