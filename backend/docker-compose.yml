# Infra locale de développement. `docker compose up -d` (Docker requis).
# En attendant Docker, un PostgreSQL 16 + Redis hébergés font l'affaire :
# renseigner DATABASE_URL / REDIS_URL dans `.env`.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: edupay
      POSTGRES_PASSWORD: edupay
      POSTGRES_DB: edupay
    ports:
      - "5432:5432"
    volumes:
      - edupay_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  edupay_pg:
